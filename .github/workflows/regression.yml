name: Code Doctor regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Code_Doctor_v1/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Code_Doctor_v1/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q Code_Doctor_v1

      - name: Run regression suite (no network APIs)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s Code_Doctor_v1/tests -p 'test_*.py' -v
